name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  notarized-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/drawstate-signing.keychain-db"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
      - name: Test
        run: swift test
      - name: Build, notarize, and staple
        env:
          DRAWSTATE_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ./Scripts/notarize-release.sh "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "build/Drawstate-$version.zip" \
            "build/Drawstate-$version.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Drawstate $version"
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          checksum="$(awk '{print $1}' "build/Drawstate-$version.zip.sha256")"
          gh repo clone Kian-hdr/homebrew-drawstate "$RUNNER_TEMP/homebrew-drawstate"
          mkdir -p "$RUNNER_TEMP/homebrew-drawstate/Casks"
          ./Scripts/render-homebrew-cask.sh "$version" "$checksum" "$RUNNER_TEMP/homebrew-drawstate/Casks/drawstate.rb"
          cd "$RUNNER_TEMP/homebrew-drawstate"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/drawstate.rb
          git commit -m "Update Drawstate to $version"
          git push
