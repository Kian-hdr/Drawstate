name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag version (for example, 1.0.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  notarized-release:
    runs-on: macos-15
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 64
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/drawstate-signing.keychain-db"
          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
      - name: Test
        run: swift test
      - name: Build, notarize, and staple
        env:
          DRAWSTATE_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: ./Scripts/notarize-release.sh "$RELEASE_VERSION"
      - name: Verify release checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cd build
          shasum -a 256 -c "Drawstate-$RELEASE_VERSION.dmg.sha256"
          shasum -a 256 -c "Drawstate-$RELEASE_VERSION.zip.sha256"
      - name: Save review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: drawstate-direct-${{ inputs.version }}
          path: |
            build/Drawstate-${{ inputs.version }}.dmg
            build/Drawstate-${{ inputs.version }}.dmg.sha256
            build/Drawstate-${{ inputs.version }}.zip
            build/Drawstate-${{ inputs.version }}.zip.sha256
          if-no-files-found: error
          retention-days: 14
